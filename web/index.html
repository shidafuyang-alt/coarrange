<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#161e1a" />
    <meta
      name="description"
      content="MusicCraft，让每一个音乐念头都有回声。创作、改编与试听的互动演示。"
    />
    <title>MusicCraft · 让灵感有回声</title>
    <link rel="icon" type="image/svg+xml" href="assets/musiccraft-mark.svg" />
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('coarrange-preferences') || '{}');
        if (['mist', 'mono', 'summer', 'midnight'].includes(p.theme))
          document.documentElement.dataset.theme = p.theme;
        document.documentElement.lang = p.language === 'en' ? 'en' : 'zh-CN';
      } catch {}
    </script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="appearance.css" />
    <link rel="stylesheet" href="song-case.css" />
    <link rel="stylesheet" href="expanded-music.css" />
    <link rel="stylesheet" href="remix-deck.css" />
    <link rel="stylesheet" href="agent.css" />
    <link rel="stylesheet" href="art-direction.css" />
    <script defer src="assets/lucide.min.js"></script>
    <script defer src="locale-extra.js"></script>
    <script defer src="i18n.js"></script>
    <script defer src="music-catalog.js"></script>
    <script defer src="sampler.js"></script>
    <script defer src="studio-score.js"></script>
    <script defer src="studio.js"></script>
    <script defer src="styles-ui.js"></script>
    <script defer src="song-waveforms.js"></script>
    <script defer src="song-case.js"></script>
    <script defer src="remix-deck.js"></script>
    <script defer src="agent-ui.js"></script>
    <script defer src="model-settings.js"></script>
    <script defer src="app.js"></script>
    <script defer src="preferences.js"></script>
  </head>
  <body>
    <button
      class="sidebar-backdrop"
      data-action="close-sidebar"
      aria-label="收起导航"
      tabindex="-1"
    ></button>
    <aside class="sidebar" id="main-sidebar">
      <a href="#workspace" class="brand" aria-label="MusicCraft 首页">
        <span class="brand-mark" aria-hidden="true"
          ><svg viewBox="0 0 40 44" fill="none">
            <path
              d="M6 32V14c0-5 5-6 8-2l6 10 6-10c3-4 8-3 8 2v18M6 23c8-10 20 10 28 0"
              stroke="currentColor"
              stroke-width="2.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            /></svg
        ></span>
        <span class="brand-type"
          ><span class="brand-name" data-i18n-ignore>Music<em>Craft</em><sup>✳</sup></span
          ><span class="brand-sub">让灵感有回声</span></span
        >
      </a>
      <button class="new-project" data-view="workspace">
        <i data-lucide="plus"></i> 开始创作 <span>⌘ K</span>
      </button>
      <div class="sidebar-scroll">
        <div class="nav-label">工作空间</div>
        <nav aria-label="主导航">
          <button class="nav-item active" data-view="workspace">
            <i data-lucide="sparkles"></i>创作与改编
          </button>
          <button class="nav-item" data-view="arrange">
            <i data-lucide="sliders-horizontal"></i>编曲工作台<span class="nav-mini">PRO</span>
          </button>
          <button class="nav-item" data-view="examples">
            <i data-lucide="headphones"></i>风格试听与对比
          </button>
        </nav>
        <div class="nav-label second">我的音乐</div>
        <nav aria-label="音乐库">
          <button class="nav-item" data-view="library"><i data-lucide="library"></i>作品库</button>
          <button class="nav-item" data-view="favorites">
            <i data-lucide="heart"></i>我的收藏
          </button>
        </nav>
        <div class="sidebar-note">
          <i data-lucide="headphones"></i>
          <p>不懂乐理，也可以<br />从喜欢的声音开始。</p>
          <button data-action="help">认识 MusicCraft <i data-lucide="chevron-right"></i></button>
        </div>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-item" data-action="settings">
          <i data-lucide="settings-2"></i>偏好设置
        </button>
        <div class="profile">
          <span class="avatar">M</span>
          <div><strong>我的创作空间</strong><span>本地保存 · 无需登录</span></div>
          <i data-lucide="chevrons-up-down"></i>
        </div>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button
            class="icon-btn sidebar-toggle"
            id="sidebar-toggle"
            data-action="toggle-sidebar"
            aria-label="收起侧栏"
            aria-controls="main-sidebar"
            aria-expanded="true"
          >
            <i data-lucide="panel-left-close"></i>
          </button>
          <div class="breadcrumb">
            <i data-lucide="audio-waveform"></i><span id="breadcrumb">你的音乐工作室</span>
          </div>
        </div>
        <div class="top-actions">
          <span class="demo-badge">交互演示版</span
          ><button
            class="language-toggle"
            id="language-toggle"
            data-action="toggle-language"
            aria-label="切换到英文"
          >
            <i data-lucide="languages"></i><span>EN</span></button
          ><button class="icon-btn" aria-label="使用帮助" data-action="help">
            <i data-lucide="circle-help"></i>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer">
        <span>MADE FOR YOUR NEXT IDEA.</span><span>MusicCraft · 课程项目初版</span>
      </footer>
    </div>
    <section class="player" aria-label="音乐播放器">
      <div class="now-playing">
        <img id="player-cover" src="assets/cover-pop.png" alt="当前音乐封面" />
        <div>
          <strong id="player-title">晴日来信</strong
          ><span id="player-subtitle">原创旋律 · 流行编配</span>
        </div>
        <button class="icon-btn favorite-btn" aria-label="收藏当前音乐" data-action="favorite">
          <i data-lucide="heart"></i>
        </button>
      </div>
      <div class="player-center">
        <div class="transport">
          <button
            class="icon-btn small"
            id="loop-button"
            aria-label="循环播放"
            aria-pressed="false"
            data-action="loop"
          >
            <i data-lucide="repeat"></i></button
          ><button class="icon-btn" aria-label="上一版本" data-action="previous">
            <i data-lucide="skip-back"></i></button
          ><button class="play-main" id="main-play" aria-label="播放" data-action="toggle">
            <i data-lucide="play"></i></button
          ><button class="icon-btn" aria-label="下一版本" data-action="next">
            <i data-lucide="skip-forward"></i></button
          ><button class="icon-btn small" aria-label="打开版本比较" data-action="compare">
            <i data-lucide="list-music"></i>
          </button>
        </div>
        <div class="seek-row">
          <span id="elapsed">0:00</span
          ><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度" /><span
            id="duration"
            >0:38</span
          >
        </div>
      </div>
      <div class="player-right">
        <span class="audio-label" id="audio-label">原创编配示例</span><i data-lucide="volume-2"></i
        ><input
          id="volume"
          aria-label="音量"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.7"
        /><button class="icon-btn" aria-label="下载当前音乐" data-action="download">
          <i data-lucide="download"></i>
        </button>
      </div>
    </section>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
